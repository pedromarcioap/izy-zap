<!DOCTYPE html>
<html>
<head>
  <title>Izy Zap</title>
  <style>
    /* General Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      min-width: 250px; /* Base width, can expand */
      padding: 15px;
      position: relative;
      background-color: #f4f4f4;
    }
    h3 {
      text-align: center;
      margin-bottom: 15px;
      color: #333;
    }

    /* Form Elements */
    #phoneNumber {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    #openButton {
      width: 100%;
      padding: 10px;
      background-color: #25D366;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    #openButton:hover {
      background-color: #128C7E;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: absolute; /* Changed from fixed to be relative to the body */
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
    }
    .modal-content {
      background-color: #fefefe;
      /* Adjusted for better centering inside a small popup */
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      border: 1px solid #888;
      width: 90%; /* Use percentage of the modal's parent */
      border-radius: 5px;
      text-align: center;
    }
    .modal-content p {
        margin-bottom: 15px;
    }
    .close {
      color: #aaa;
      position: absolute; /* Position relative to modal-content */
      top: 5px;
      right: 10px;
      font-size: 28px;
      font-weight: bold;
    }
    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .modal-content button {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background-color: #fff;
    }
    #openTabButton {
        background-color: #2196F3;
        color: white;
        border-color: #2196F3;
    }
    #openTabButton:hover {
        background-color: #0b7dda;
    }
    #copyLinkButton:hover {
        background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h3>Izy Zap</h3>
  <input type="text" id="phoneNumber" placeholder="(XX) XXXXX-XXXX">
  <button id="openButton">Gerar Link</button>

  <!-- The Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p>O que você deseja fazer?</p>
      <button id="openTabButton">Abrir em nova guia</button>
      <button id="copyLinkButton">Copiar link</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
