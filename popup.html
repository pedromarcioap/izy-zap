<!DOCTYPE html>
<html>
<head>
  <title>Izy Zap</title>
  <style>
    /* General Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      width: 320px; /* A bit wider for the new input */
      min-height: 150px;
      padding: 15px;
      background-color: #f4f4f4;
      text-align: center;
    }
    h3 {
      margin-bottom: 15px;
      color: #333;
    }
    button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 5px;
    }
    .hidden {
      display: none;
    }

    /* Input View */
    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 10px;
      text-align: left;
    }
    .input-group label {
      margin-bottom: 4px;
      font-size: 14px;
      color: #555;
    }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    #inputView textarea {
      resize: vertical;
      min-height: 60px;
    }
    #inputView #generateLinkButton {
      background-color: #25D366;
      color: white;
      margin-top: 10px;
    }
    #inputView #generateLinkButton:hover {
      background-color: #128C7E;
    }

    /* Options View & QR View Buttons */
    #optionsView p, #qrCodeView p {
        margin-bottom: 15px;
        font-size: 16px;
    }
    #openTabButton { background-color: #2196F3; color: white; }
    #openTabButton:hover { background-color: #0b7dda; }
    #copyLinkButton { background-color: #fff; border: 1px solid #ccc; }
    #copyLinkButton:hover { background-color: #f0f0f0; }
    #generateQrButton { background-color: #ff9800; color: white; }
    #generateQrButton:hover { background-color: #f57c00; }
    .back-button { background-color: #6c757d; color: white; margin-top: 15px; }
    .back-button:hover { background-color: #5a6268; }

    /* QR Code View */
    #qrCodeContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    #qrCodeContainer img {
        max-width: 100%;
    }

  </style>
</head>
<body>

  <!-- View 1: Input -->
  <div id="inputView">
    <h3>Izy Zap</h3>
    <div class="input-group">
      <label for="countryCodeInput">País (DDI)</label>
      <input type="text" id="countryCodeInput" list="countryCodesList" placeholder="Selecione ou digite o país/código">
      <datalist id="countryCodesList">
        <!-- This list will be populated by JS, but some examples are here -->
        <option data-value="55">🇧🇷 Brasil (+55)</option>
        <option data-value="1">🇺🇸 Estados Unidos (+1)</option>
        <option data-value="351">🇵🇹 Portugal (+351)</option>
        <option data-value="44">🇬🇧 Reino Unido (+44)</option>
      </datalist>
    </div>
    <div class="input-group">
      <label for="phoneNumber">Telefone (com DDD)</label>
      <input type="tel" id="phoneNumber" placeholder="Ex: 11999998888">
    </div>
    <div class="input-group">
      <label for="prewrittenMessage">Mensagem (opcional)</label>
      <textarea id="prewrittenMessage"></textarea>
    </div>
    <button id="generateLinkButton">Gerar Link</button>
  </div>

  <!-- View 2: Options -->
  <div id="optionsView" class="hidden">
    <p>O que você deseja fazer?</p>
    <button id="openTabButton">Abrir em nova guia</button>
    <button id="copyLinkButton">Copiar link</button>
    <button id="generateQrButton">Gerar QR Code</button>
    <button id="backButton" class="back-button">Voltar</button>
  </div>

  <!-- View 3: QR Code -->
  <div id="qrCodeView" class="hidden">
      <p>Escaneie o QR Code</p>
      <div id="qrCodeContainer"></div>
      <button id="qrBackButton" class="back-button">Voltar</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
