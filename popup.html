<!DOCTYPE html>
<html>
<head>
  <title>Izy Zap</title>
  <style>
    /* General Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      width: 280px;
      min-height: 150px;
      padding: 15px;
      background-color: #f4f4f4;
      text-align: center;
    }
    h3 {
      margin-bottom: 15px;
      color: #333;
    }
    button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 5px;
    }
    .hidden {
      display: none;
    }

    /* Input View */
    .phone-input-group {
      display: flex;
      margin-bottom: 10px;
    }
    .phone-input-group select {
      padding: 8px;
      border: 1px solid #ddd;
      border-right: none;
      border-radius: 4px 0 0 4px;
      background-color: #fff;
    }
    .phone-input-group input {
      flex-grow: 1;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 0 4px 4px 0;
    }
    #inputView textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      resize: vertical;
      min-height: 60px;
    }
    #inputView #generateLinkButton {
      background-color: #25D366;
      color: white;
    }
    #inputView #generateLinkButton:hover {
      background-color: #128C7E;
    }

    /* Options View & QR View Buttons */
    #optionsView p, #qrCodeView p {
        margin-bottom: 15px;
        font-size: 16px;
    }
    #openTabButton { background-color: #2196F3; color: white; }
    #openTabButton:hover { background-color: #0b7dda; }
    #copyLinkButton { background-color: #fff; border: 1px solid #ccc; }
    #copyLinkButton:hover { background-color: #f0f0f0; }
    #generateQrButton { background-color: #ff9800; color: white; }
    #generateQrButton:hover { background-color: #f57c00; }
    .back-button { background-color: #6c757d; color: white; margin-top: 15px; }
    .back-button:hover { background-color: #5a6268; }

    /* QR Code View */
    #qrCodeContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    #qrCodeContainer img {
        max-width: 100%;
    }

  </style>
</head>
<body>

  <!-- View 1: Input -->
  <div id="inputView">
    <h3>Izy Zap</h3>
    <div class="phone-input-group">
      <select id="countryCode">
        <option value="55" selected>🇧🇷 +55</option>
        <option value="1">🇺🇸 +1</option>
        <option value="351">🇵🇹 +351</option>
        <option value="44">🇬🇧 +44</option>
        <option value="49">🇩🇪 +49</option>
        <option value="34">🇪🇸 +34</option>
        <option value="39">🇮🇹 +39</option>
        <option value="81">🇯🇵 +81</option>
      </select>
      <input type="tel" id="phoneNumber" placeholder="Seu número">
    </div>
    <textarea id="prewrittenMessage" placeholder="Digite uma mensagem opcional..."></textarea>
    <button id="generateLinkButton">Gerar Link</button>
  </div>

  <!-- View 2: Options -->
  <div id="optionsView" class="hidden">
    <p>O que você deseja fazer?</p>
    <button id="openTabButton">Abrir em nova guia</button>
    <button id="copyLinkButton">Copiar link</button>
    <button id="generateQrButton">Gerar QR Code</button>
    <button id="backButton" class="back-button">Voltar</button>
  </div>

  <!-- View 3: QR Code -->
  <div id="qrCodeView" class="hidden">
      <p>Escaneie o QR Code</p>
      <div id="qrCodeContainer"></div>
      <button id="qrBackButton" class="back-button">Voltar</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
