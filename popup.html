<!DOCTYPE html>
<html>
<head>
  <title>Izy Zap</title>
  <style>
    /* General Styles */
    :root {
      --whatsapp-green: #25D366;
      --whatsapp-green-dark: #128C7E;
      --background-color: #f0f2f5;
      --text-color: #4a4a4a;
      --border-color: #dcdcdc;
      --footer-height: 30px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      min-height: 150px;
      padding: 15px;
      padding-bottom: var(--footer-height); /* Space for the footer */
      background-color: var(--background-color);
      text-align: center;
      color: var(--text-color);
    }
    h3 {
      margin-bottom: 15px;
      color: var(--whatsapp-green-dark);
      font-weight: 600;
    }
    .hidden {
      display: none;
    }

    /* Input View */
    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
      text-align: left;
    }
    .input-group label {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 500;
    }
    .input-group input, .input-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
    }
    .input-group input:focus, .input-group textarea:focus {
      outline: none;
      border-color: var(--whatsapp-green);
      box-shadow: 0 0 0 2px rgba(37, 211, 102, 0.2);
    }
    #inputView textarea {
      resize: vertical;
      min-height: 70px;
    }

    /* Buttons */
    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      margin-top: 8px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    button:active {
        transform: scale(0.98);
    }

    /* Primary Button Style */
    .btn-primary {
      background-color: var(--whatsapp-green);
      color: white;
      border: none;
    }
    .btn-primary:hover {
      background-color: var(--whatsapp-green-dark);
    }

    /* Secondary Button Style */
    .btn-secondary {
      background-color: #e4e6eb;
      color: #050505;
      border: none;
    }
    .btn-secondary:hover {
      background-color: #d8dade;
    }

    /* Tertiary/Back Button Style */
    .btn-tertiary {
      background-color: transparent;
      color: #65676b;
      border: 1px solid var(--border-color);
    }
    .btn-tertiary:hover {
      background-color: #f2f2f2;
    }

    /* Options View */
    #optionsView p {
        margin-bottom: 15px;
        font-size: 16px;
    }

    /* QR Code View */
    #qrCodeContainer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 15px;
    }
    #qrCodeContainer img {
        max-width: 100%;
    }

    /* Footer */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--footer-height);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #8a8d91;
      background-color: var(--background-color);
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>
<body>

  <!-- View 1: Input -->
  <div id="inputView">
    <h3>Izy Zap</h3>
    <div class="input-group">
      <label for="countryCodeInput">País (DDI)</label>
      <input type="text" id="countryCodeInput" list="countryCodesList" placeholder="Selecione ou digite o país/código">
      <datalist id="countryCodesList"></datalist>
    </div>
    <div class="input-group">
      <label for="phoneNumber">Telefone (com DDD)</label>
      <input type="tel" id="phoneNumber" placeholder="Ex: 11999998888">
    </div>
    <div class="input-group">
      <label for="prewrittenMessage">Mensagem (opcional)</label>
      <textarea id="prewrittenMessage"></textarea>
    </div>
    <button id="generateLinkButton" class="btn-primary">Gerar Link</button>
  </div>

  <!-- View 2: Options -->
  <div id="optionsView" class="hidden">
    <p>O que você deseja fazer?</p>
    <button id="openTabButton" class="btn-primary">Abrir em nova guia</button>
    <button id="copyLinkButton" class="btn-secondary">Copiar link</button>
    <button id="generateQrButton" class="btn-secondary">Gerar QR Code</button>
    <button id="backButton" class="btn-tertiary">Voltar</button>
  </div>

  <!-- View 3: QR Code -->
  <div id="qrCodeView" class="hidden">
      <p>Escaneie o QR Code</p>
      <div id="qrCodeContainer"></div>
      <button id="qrBackButton" class="btn-tertiary">Voltar</button>
  </div>

  <footer>
    Feito com 💛 por Pedro Márcio Di Pietro.
  </footer>

  <script src="lib/qrcode.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
