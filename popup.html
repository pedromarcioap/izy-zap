<!DOCTYPE html>
<html>
<head>
  <title>Izy Zap</title>
  <style>
    /* General Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: sans-serif;
      width: 280px; /* A bit wider for better spacing */
      min-height: 150px; /* Ensure enough height for both views */
      padding: 15px;
      background-color: #f4f4f4;
      text-align: center;
    }
    h3 {
      margin-bottom: 15px;
      color: #333;
    }
    button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 5px;
    }
    .hidden {
      display: none;
    }

    /* Input View */
    #inputView #phoneNumber {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    #inputView #generateLinkButton {
      background-color: #25D366;
      color: white;
    }
    #inputView #generateLinkButton:hover {
      background-color: #128C7E;
    }

    /* Options View */
    #optionsView p {
        margin-bottom: 15px;
        font-size: 16px;
    }
    #optionsView #openTabButton {
        background-color: #2196F3;
        color: white;
    }
    #optionsView #openTabButton:hover {
        background-color: #0b7dda;
    }
    #optionsView #copyLinkButton {
        background-color: #fff;
        border: 1px solid #ccc;
    }
    #optionsView #copyLinkButton:hover {
        background-color: #f0f0f0;
    }
     #optionsView #backButton {
        background-color: #6c757d;
        color: white;
        margin-top: 15px; /* More space for the back button */
    }
    #optionsView #backButton:hover {
        background-color: #5a6268;
    }
  </style>
</head>
<body>

  <!-- View 1: Input -->
  <div id="inputView">
    <h3>Izy Zap</h3>
    <input type="text" id="phoneNumber" placeholder="(XX) XXXXX-XXXX">
    <button id="generateLinkButton">Gerar Link</button>
  </div>

  <!-- View 2: Options -->
  <div id="optionsView" class="hidden">
    <p>O que você deseja fazer?</p>
    <button id="openTabButton">Abrir em nova guia</button>
    <button id="copyLinkButton">Copiar link</button>
    <button id="backButton">Voltar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
