<!DOCTYPE html>
<html>
<head>
  <title>WhatsApp Link Opener</title>
  <style>
    body {
      font-family: sans-serif;
      width: 250px;
      position: relative;
    }
    #phoneNumber {
      box-sizing: border-box;
      width: 100%;
      padding: 5px;
      margin-bottom: 10px;
    }
    #openButton {
      width: 100%;
      padding: 10px;
      background-color: #25D366;
      color: white;
      border: none;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgb(0,0,0);
      background-color: rgba(0,0,0,0.4);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      text-align: center;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
    }
    .close:hover,
    .close:focus {
      color: black;
      text-decoration: none;
      cursor: pointer;
    }
    .modal-content button {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>Open WhatsApp Chat</h3>
  <input type="text" id="phoneNumber" placeholder="(XX) XXXXX-XXXX">
  <button id="openButton">Gerar Link</button>

  <!-- The Modal -->
  <div id="myModal" class="modal">
    <!-- Modal content -->
    <div class="modal-content">
      <span class="close">&times;</span>
      <p>O que você deseja fazer?</p>
      <button id="openTabButton">Abrir em nova guia</button>
      <button id="copyLinkButton">Copiar link</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
